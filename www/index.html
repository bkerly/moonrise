<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonrise</title>
<link rel="icon" href="/wall/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/wall/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/wall/icons/apple-touch-icon.png">
<link rel="manifest" href="/wall/manifest.webmanifest">
<meta name="theme-color" content="#1D1B18">
<link rel="stylesheet" href="/wall/wall.css">
</head>
<body>
<header class="top">
  <div class="top-left">
    <h1 id="heading" class="heading">Moonrise</h1>
    <div class="nav">
      <button id="nav-prev" class="nav-btn" type="button" aria-label="Previous week">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2L4 7l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="nav-today" class="nav-today" type="button">Today</button>
      <button id="nav-next" class="nav-btn" type="button" aria-label="Next week">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <div class="top-right">
    <span id="status" class="status" hidden>Can't reach the server</span>
    <button id="review-btn" class="review-btn" type="button" hidden></button>
    <span id="clock" class="clock"></span>
  </div>
</header>
<p id="outside-note" class="outside-note" hidden></p>
<main id="week" class="week">
  <p class="loading">Loading the week…</p>
</main>
<footer id="legend" class="legend"></footer>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title" class="sheet-title">Add event</h2>
      <span id="sheet-note" class="sheet-note"></span>
    </div>

    <div id="form-event">
      <label class="field">
        <span class="field-label">What</span>
        <input id="f-title" class="input" type="text" autocomplete="off" maxlength="200">
      </label>
      <div class="field">
        <span class="field-label">Who</span>
        <div id="f-who" class="chips"></div>
      </div>
      <div class="row">
        <label class="field grow">
          <span class="field-label">Day</span>
          <input id="f-date" class="input" type="date">
        </label>
        <label class="check">
          <input id="f-allday" type="checkbox"> All day
        </label>
      </div>
      <div id="f-times" class="row">
        <label class="field grow">
          <span class="field-label">Starts</span>
          <input id="f-start" class="input" type="time">
        </label>
        <label class="field grow">
          <span class="field-label">Ends</span>
          <input id="f-end" class="input" type="time">
        </label>
      </div>
      <div id="f-lastday" class="row" hidden>
        <label class="field grow">
          <span class="field-label">Last day</span>
          <input id="f-enddate" class="input" type="date">
        </label>
      </div>

      <!-- New events only: how it repeats. -->
      <div id="f-repeat-box">
        <div class="row">
          <label class="field grow">
            <span class="field-label">Repeats</span>
            <select id="f-repeat" class="input"></select>
          </label>
          <label id="f-ends-box" class="field grow" hidden>
            <span class="field-label">Ends</span>
            <select id="f-ends" class="input">
              <option value="never">Never</option>
              <option value="on">On a date</option>
              <option value="after">After N times</option>
            </select>
          </label>
          <label id="f-until-box" class="field grow" hidden>
            <span class="field-label">Last time</span>
            <input id="f-until" class="input" type="date">
          </label>
          <label id="f-count-box" class="field narrow" hidden>
            <span class="field-label">Times</span>
            <input id="f-count" class="input" type="number" min="1" max="500" value="10">
          </label>
        </div>
        <div id="f-days-box" class="field" hidden>
          <span class="field-label">On</span>
          <div id="f-days" class="chips"></div>
        </div>
        <div id="f-as-box" class="field" hidden>
          <span class="field-label">Save as</span>
          <div id="f-as" class="chips"></div>
          <span id="f-as-hint" class="hint"></span>
        </div>
      </div>

      <!-- Repeating events only: change this day or the whole series. -->
      <div id="f-scope-box" class="field" hidden>
        <span class="field-label">Change</span>
        <div id="f-scope" class="chips"></div>
        <span id="f-scope-hint" class="hint"></span>
      </div>
    </div>

    <!-- Everything awaiting review, any date. -->
    <ul id="review-list" class="review-list" hidden></ul>

    <div id="form-dinner" hidden>
      <label class="field">
        <span class="field-label">Dinner</span>
        <input id="f-dinner" class="input" type="text" autocomplete="off" maxlength="200">
      </label>
    </div>

    <p id="sheet-error" class="sheet-error" hidden></p>

    <div class="sheet-buttons">
      <button id="b-delete" class="btn danger" type="button">Delete</button>
      <span class="spacer"></span>
      <button id="b-cancel" class="btn" type="button">Cancel</button>
      <button id="b-accept" class="btn primary" type="button">Accept</button>
      <button id="b-save" class="btn primary" type="button">Save</button>
    </div>
  </div>
</div>

<script src="/wall/wall.js"></script>
</body>
</html>
