<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Moonrise: a crescent moon rising over an orange horizon. -->
  <defs>
    <mask id="crescent">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="42" cy="22" r="14" fill="#000"/>
    </mask>
    <clipPath id="sky">
      <rect width="64" height="45"/>
    </clipPath>
  </defs>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14" fill="#1D1B18" stroke="#3D3934" stroke-width="1.5"/>
  <g clip-path="url(#sky)">
    <circle cx="30" cy="33" r="19" fill="#F4F1EA" mask="url(#crescent)"/>
  </g>
  <rect x="8" y="44" width="48" height="6" rx="3" fill="#E69F00"/>
</svg>
